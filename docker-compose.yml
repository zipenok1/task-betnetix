version: '3.8'

services:

  postgres:
    container_name: betnetix_postgres
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: betnetix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - betnetix_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betnetix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: betnetix_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/betnetix"
      JWT_SECRET: "super-secret-key"
      JWT_REFRESH_SECRET: "super-refresh-secret-key"
      SERVER_PORT: 3000
      ROOT_PASSWORD: "root123"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - betnetix_network

volumes:
  postgres_data:

networks:
  betnetix_network:
    driver: bridge